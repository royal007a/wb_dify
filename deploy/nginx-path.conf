# Include this snippet inside an existing TLS server when Hify shares a host.
# Build with: VITE_BASE_PATH=/hify/ VITE_API_BASE_URL=/hify/api npm run build
location = /hify {
    return 308 /hify/;
}

location ^~ /hify/api/ {
    client_max_body_size 12m;
    error_page 413 = @hify_upload_too_large;
    proxy_request_buffering on;
    proxy_pass http://127.0.0.1:28080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The browser has already enforced same-origin at this TLS virtual host.
    # Do not let the upstream's internal http origin trigger a false CORS rejection.
    proxy_set_header Origin "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
    add_header X-Accel-Buffering no;
}

# Hify-scoped handler; do not replace another app's server-wide error_page.
location @hify_upload_too_large {
    default_type application/json;
    return 413 '{"code":41300,"message":"上传内容超过大小限制","data":null}';
}

location ^~ /hify/ {
    alias /opt/hify/frontend/dist/;
    try_files $uri $uri/ /hify/index.html;
}
