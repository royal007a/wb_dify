server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Match the application's 12MiB request ceiling (10MiB file plus framing).
        client_max_body_size 12m;
        error_page 413 = @hify_upload_too_large;
        proxy_request_buffering on;
        proxy_pass http://hify-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        # The browser has already enforced same-origin at this reverse proxy.
        # Do not let the upstream container see the public Origin as cross-origin.
        proxy_set_header Origin "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        add_header X-Accel-Buffering no;
    }

    location @hify_upload_too_large {
        default_type application/json;
        return 413 '{"code":41300,"message":"上传内容超过大小限制","data":null}';
    }

    location /actuator/ {
        proxy_pass http://hify-app:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
